name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      # The engine must also run in a browser (docs/DESIGN.md, "Runs in a
      # browser"). Building the library for WebAssembly proves it still can.
      - name: Browser (WebAssembly) build
        run: cargo build --lib --release --target wasm32-unknown-unknown
      # The Lichess bot's settings (bot/): the ones a game depends on.
      - name: Bot config checks
        run: python3 -m unittest discover -s bot -v
