name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      # The engine must also run in a browser (docs/DESIGN.md, "Runs in a
      # browser"). Building the library for WebAssembly proves it still can.
      - name: Browser (WebAssembly) build
        run: cargo build --lib --release --target wasm32-unknown-unknown
      # The Lichess bot's settings (bot/): the ones a game depends on.
      # Fetches lichess-bot at the pinned commit, so the test that its log
      # lines still match cloud-homelab's metric filters runs too.
      - name: Bot config checks
        run: |
          git init -q /tmp/lichess-bot
          git -C /tmp/lichess-bot fetch -q --depth 1 https://github.com/lichess-bot-devs/lichess-bot "$(cat bot/LICHESS_BOT_COMMIT)"
          git -C /tmp/lichess-bot checkout -q FETCH_HEAD
          LICHESS_BOT_SRC=/tmp/lichess-bot python3 -m unittest discover -s bot -v
