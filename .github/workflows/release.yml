name: Release

# Pushing a version tag (v0.2.0) publishes that version: Actions builds the
# engine for ARM Linux (the Lichess bot's server, and the test rig) and
# attaches it, with its SHA-256 checksum and `bench` node count, to a GitHub
# release of the same name. The bot runs whichever release bot/ENGINE names
# (docs/runbooks/lichess-bot.md). Decided 2026-10-25 (DECISIONS.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # The tag must match the version in Cargo.toml (what `uci` reports as
      # the engine's name), so a release can't claim the wrong version.
      - name: Check the tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG doesn't match Cargo.toml's version $version"; exit 1; }

      - name: Test
        run: cargo test --release

      # Built on the same Ubuntu as the bot's server (24.04), so the C
      # library it links against is the one it runs with.
      - name: Install the ARM cross-compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu
      - name: Build for ARM
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          mkdir dist
          cp target/aarch64-unknown-linux-gnu/release/stargazer dist/stargazer-aarch64-linux
          (cd dist && sha256sum stargazer-aarch64-linux > stargazer-aarch64-linux.sha256)
          file dist/stargazer-aarch64-linux

      # bench's node count is the same on every machine, so the x86 build's
      # count fingerprints the ARM one too; the bot logs its own at install.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo build --release
          bench=$(./target/release/stargazer bench | tail -n 1)
          {
            echo "Stargazer $TAG, built from $GITHUB_SHA."
            echo
            echo "- \`$bench\` (the node count fingerprints this build)"
            echo "- \`stargazer-aarch64-linux\`: ARM64 Linux, built on Ubuntu 24.04 (the bot server's OS)"
            echo "- SHA-256: \`$(cut -d' ' -f1 dist/stargazer-aarch64-linux.sha256)\`"
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "Stargazer $TAG" --notes-file notes.md --verify-tag
